name: Play (GitHub Pages)

# Publishes web/ so the game is playable from a link - no clone, no install:
#   https://<owner>.github.io/<repo>/
#
# The build artefacts (web/doom.wasm, web/assets/freedoom1.wad.gz) are committed,
# so publishing is just a checkout and an upload: about 10 MB, no toolchain.
#
# GitHub Pages has to be switched on once by the repository owner
# (Settings -> Pages -> Source: "GitHub Actions"); no API token available to a
# workflow can do it.  Until then this workflow stays green and prints exactly
# where to click; once it is on, the next push - or the next scheduled run -
# publishes the game.

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    # Retry every 20 minutes so the site appears by itself shortly after Pages
    # is enabled.  Delete this block once the link is live (or to stop the runs).
    - cron: "*/20 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble the site
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the artefacts are present
        run: |
          set -e
          test -f web/index.html || { echo "web/index.html missing"; exit 1; }
          test -f web/doom.wasm || { echo "web/doom.wasm missing - run ./build.sh"; exit 1; }
          test -f web/assets/freedoom1.wad.gz || { echo "IWAD missing"; exit 1; }
          echo "engine : $(du -h web/doom.wasm | cut -f1)"
          echo "game   : $(du -h web/assets/freedoom1.wad.gz | cut -f1)"
          echo "total  : $(du -sh web | cut -f1)"

      - name: Is GitHub Pages switched on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 404 means definitively "not enabled" -> skip publishing with a clear
          # note.  Anything else (e.g. the API refusing to be read) is unknown,
          # so carry on and let configure-pages report the truth: never silently
          # skip a publish just because a probe failed.
          if output=$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>&1); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages is enabled - publishing web/."
          elif printf '%s' "$output" | grep -qiE 'not found|404'; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ One click left: switch GitHub Pages on"
              echo
              echo "**Settings → Pages → Source: “GitHub Actions”**"
              echo
              echo "<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/settings/pages>"
              echo
              echo "This workflow then publishes the game to"
              echo "<https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/>"
              echo "within 20 minutes - or immediately if you press *Re-run all jobs*."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Enable GitHub Pages::Settings -> Pages -> Source: \"GitHub Actions\"  (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/settings/pages). This workflow retries every 20 minutes and publishes the game as soon as it is on."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Could not read the Pages settings::Trying to publish anyway. ${output}"
          fi

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload the game
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    name: Publish
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          {
            echo "### ☠ Play it"
            echo
            echo "[${{ steps.deployment.outputs.page_url }}](${{ steps.deployment.outputs.page_url }})"
            echo
            echo "Engine: doomgeneric (GPL-2.0) → WebAssembly · Data: Freedoom (BSD-3-Clause)"
          } >> "$GITHUB_STEP_SUMMARY"
